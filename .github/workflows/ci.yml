name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate metadata and scripts
        run: |
          plutil -lint Info.plist
          # `zsh -n a b` syntax-checks only `a`; `b` becomes a positional parameter.
          zsh -n build.sh
          zsh -n tests.sh

      - name: Run tests with sanitizers
        env:
          GLANCEBAR_TEST_SANITIZERS: "1"
        run: ./tests.sh

      - name: Run static analyzer
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          for source in Sources/pure.m Sources/main.m; do
            # -Werror does not promote analyzer diagnostics; without -analyzer-werror this
            # step prints its findings and still exits 0, so the gate never fails a build.
            xcrun clang --analyze -Xclang -analyzer-werror -fobjc-arc -Wall -Wextra -Werror \
              -isysroot "$SDKROOT" -mmacosx-version-min=13.0 \
              "$source" -o /dev/null
          done

      - name: Build Universal 2 app
        run: ./build.sh

      - name: Verify CLI JSON contract
        run: |
          mkdir -p "$RUNNER_TEMP/glancebar-home"
          GLANCEBAR_HOME="$RUNNER_TEMP/glancebar-home" \
            GLANCEBAR_ALLOW_ACCOUNT=0 \
            build/Glancebar.app/Contents/MacOS/Glancebar --dump --json \
            > "$RUNNER_TEMP/glancebar.json"
          # `plutil -lint` parses property lists, not JSON, and rejects a leading '{'.
          # JSON.parse is the real syntax check, so assert the schema off the parsed value.
          ruby -rjson -e '
            j = JSON.parse(File.read(ARGV[0]))
            fail "schemaVersion"   unless j["schemaVersion"] == 1
            fail "status"          unless j["status"].is_a?(String)
            fail "partialSources"  unless j["partialSources"].is_a?(Array)
            # Real JSON booleans, not 0/1 or "false".
            fail "onlineAllowed"   unless j.dig("ai", "onlineAllowed") == false
            fail "accountEnabled"  unless [true, false].include?(j.dig("ai", "accountEnabled"))
          ' "$RUNNER_TEMP/glancebar.json"
          # An unreadable source must degrade the schema, not collapse it, and --strict must say so.
          GLANCEBAR_HOME="$RUNNER_TEMP/glancebar-home" GLANCEBAR_ALLOW_ACCOUNT=0 \
            build/Glancebar.app/Contents/MacOS/Glancebar --dump --json --strict \
            > /dev/null && strict_rc=0 || strict_rc=$?
          test "$strict_rc" = 2 || { echo "expected --strict exit 2 on a partial dump, got $strict_rc"; exit 1; }

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 build/Glancebar.app
          test "$(plutil -extract CFBundleShortVersionString raw -o - build/Glancebar.app/Contents/Info.plist)" = "1.1.0"
          test "$(plutil -extract CFBundleVersion raw -o - build/Glancebar.app/Contents/Info.plist)" = "2"
          test "$(build/Glancebar.app/Contents/MacOS/Glancebar --version)" = "Glancebar 1.1.0"
          test -f build/Glancebar.app/Contents/Resources/Glancebar.icns
          # lipo takes the file first; `lipo -verify_arch a b FILE` reads FILE as an arch name.
          lipo build/Glancebar.app/Contents/MacOS/Glancebar -verify_arch arm64 x86_64
