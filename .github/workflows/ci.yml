name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate metadata and scripts
        run: |
          plutil -lint Info.plist
          # `zsh -n a b` syntax-checks only `a`; `b` becomes a positional parameter.
          zsh -n build.sh
          zsh -n tests.sh
          zsh -n Tests/make_fixture_home.sh

      - name: Run tests with sanitizers
        env:
          GLANCEBAR_TEST_SANITIZERS: "1"
        run: ./tests.sh

      - name: Run static analyzer
        run: |
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          for source in Sources/pure.m Sources/main.m; do
            # -Werror does not promote analyzer diagnostics; without -analyzer-werror this
            # step prints its findings and still exits 0, so the gate never fails a build.
            xcrun clang --analyze -Xclang -analyzer-werror -fobjc-arc -Wall -Wextra -Werror \
              -isysroot "$SDKROOT" -mmacosx-version-min=13.0 \
              "$source" -o /dev/null
          done

      - name: Build Universal 2 app
        env:
          # Explicit, not incidental: a runner has no signing identity, but the build must
          # not start picking one up if that ever changes.
          GLANCEBAR_ADHOC: "1"
        run: ./build.sh

      - name: Verify CLI JSON contract
        run: |
          mkdir -p "$RUNNER_TEMP/glancebar-home"
          GLANCEBAR_HOME="$RUNNER_TEMP/glancebar-home" \
            GLANCEBAR_ALLOW_ACCOUNT=0 \
            build/Glancebar.app/Contents/MacOS/Glancebar --dump --json \
            > "$RUNNER_TEMP/glancebar.json"
          # `plutil -lint` parses property lists, not JSON, and rejects a leading '{'.
          # JSON.parse is the real syntax check, so assert the schema off the parsed value.
          ruby -rjson -e '
            j = JSON.parse(File.read(ARGV[0]))
            fail "schemaVersion"   unless j["schemaVersion"] == 1
            fail "status"          unless j["status"].is_a?(String)
            fail "partialSources"  unless j["partialSources"].is_a?(Array)
            # Real JSON booleans, not 0/1 or "false".
            fail "onlineAllowed"   unless j.dig("ai", "onlineAllowed") == false
            fail "accountEnabled"  unless [true, false].include?(j.dig("ai", "accountEnabled"))
          ' "$RUNNER_TEMP/glancebar.json"
          # An unreadable source must degrade the schema, not collapse it, and --strict must say so.
          GLANCEBAR_HOME="$RUNNER_TEMP/glancebar-home" GLANCEBAR_ALLOW_ACCOUNT=0 \
            build/Glancebar.app/Contents/MacOS/Glancebar --dump --json --strict \
            > /dev/null && strict_rc=0 || strict_rc=$?
          test "$strict_rc" = 2 || { echo "expected --strict exit 2 on a partial dump, got $strict_rc"; exit 1; }

      - name: Verify the JSON contract against a determined fixture
        run: |
          # The cached Claude response is consent-gated even for an offline dump.
          # Set consent only on this disposable runner; never permit an account request.
          defaults write com.iantodd.glancebar useClaudeAccount -bool true
          trap 'defaults delete com.iantodd.glancebar useClaudeAccount' EXIT
          FIXTURE="$(Tests/make_fixture_home.sh "$RUNNER_TEMP/glancebar-fixture")"
          GLANCEBAR_HOME="$FIXTURE" GLANCEBAR_ALLOW_ACCOUNT=0 \
            build/Glancebar.app/Contents/MacOS/Glancebar --dump --json \
            > "$RUNNER_TEMP/glancebar-fixture.json"
          # An empty home only proves the envelope. This asserts the numbers a user reads:
          # the spent plan bucket governs, the untouched side bucket does not, and the
          # Claude limits[] array yields all three windows including the model-scoped one.
          ruby -rjson -e '
            j = JSON.parse(File.read(ARGV[0]))
            ai = j["ai"]
            fail "account consent"     unless ai["accountEnabled"] == true
            fail "offline fixture"     unless ai["onlineAllowed"] == false && ai["accountRequested"] == false
            codex = ai["providers"].find { |p| p["name"] == "Codex" }
            fail "codex missing"        unless codex
            fail "codex gauge"          unless codex["remainingPercent"].between?(0.5, 1.5)
            fail "codex windows"        unless codex["windows"].length == 3
            gov = codex["windows"].first
            fail "governing bucket"     unless gov["bucket"] == "codex" && gov["bucketLabel"] == "plan"
            fail "governing window"     unless gov["window"] == "weekly"
            fail "billing note"         unless codex["billingNote"].to_s.include?("none available")
            fail "codex tokens"         unless codex["todayFreshTokens"] > 0
            claude = ai["providers"].find { |p| p["name"] == "Claude" }
            fail "claude windows"       unless claude["windows"].map { |w| w["window"] } ==
                                               ["5-hour", "weekly", "weekly Fable"]
            fail "claude gauge"         unless claude["remainingPercent"].round == 25
            fail "claude stale"         unless claude["limitStale"] == true
            fail "extra usage"          unless claude["extraUsage"].to_s.start_with?("Off")
            fail "ai available"         unless ai["available"] == true
            fail "ai error"             unless ai["error"].nil?
            fail "ai history"           unless ai["totalsIncomplete"] == false
            partial = j["partialSources"]
            fail "partial AI sources"   if partial.any? { |s| s == "ai" || s.start_with?("ai.") }
            fail "status matches sources" unless j["status"] == (partial.empty? ? "complete" : "partial")
          ' "$RUNNER_TEMP/glancebar-fixture.json"
          # Only AI data is fixtured. Runner hardware (e.g. no battery) can legitimately
          # be partial; strict must agree with this dump without hiding an AI failure.
          GLANCEBAR_HOME="$FIXTURE" GLANCEBAR_ALLOW_ACCOUNT=0 \
            build/Glancebar.app/Contents/MacOS/Glancebar --dump --strict --json \
            > "$RUNNER_TEMP/glancebar-fixture-strict.json" && strict_rc=0 || strict_rc=$?
          ruby -rjson -e '
            j = JSON.parse(File.read(ARGV[0]))
            partial = j["partialSources"]
            fail "strict AI fixture" if partial.any? { |s| s == "ai" || s.start_with?("ai.") }
            expected_status = partial.empty? ? "complete" : "partial"
            fail "strict status" unless j["status"] == expected_status
            fail "strict exit" unless ARGV[1].to_i == (partial.empty? ? 0 : 2)
          ' "$RUNNER_TEMP/glancebar-fixture-strict.json" "$strict_rc"

      - name: Verify bundle
        run: |
          codesign --verify --strict --verbose=2 build/Glancebar.app
          test "$(plutil -extract CFBundleShortVersionString raw -o - build/Glancebar.app/Contents/Info.plist)" = "1.1.0"
          test "$(plutil -extract CFBundleVersion raw -o - build/Glancebar.app/Contents/Info.plist)" = "3"
          test "$(build/Glancebar.app/Contents/MacOS/Glancebar --version)" = "Glancebar 1.1.0"
          test -f build/Glancebar.app/Contents/Resources/Glancebar.icns
          # Verify separately: some lipo versions parse a second architecture as an input file.
          lipo build/Glancebar.app/Contents/MacOS/Glancebar -verify_arch arm64
          lipo build/Glancebar.app/Contents/MacOS/Glancebar -verify_arch x86_64
